<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bedwars — Lobby</title>
  <link rel="icon" href="assets/lobby/flag.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="bg"></div>

  <main id="app">
    <header class="brand">
      <img id="logo" src="assets/lobby/logo.svg" alt="Bedwars">
      <p class="tagline">scratch version &mdash; online</p>
    </header>

    <!-- Username screen -->
    <section id="name-screen" class="screen">
      <div class="panel">
        <h2>Choose your username</h2>
        <input id="name-input" type="text" maxlength="16" autocomplete="off"
               spellcheck="false" placeholder="player">
        <p id="name-error" class="error" hidden></p>
        <button id="name-btn" class="btn">Enter lobby</button>
      </div>
    </section>

    <!-- Lobby screen -->
    <section id="lobby-screen" class="screen" hidden>
      <div class="panel players-panel">
        <h2>Online players <span id="player-count" class="badge">0</span></h2>
        <ul id="player-list"></ul>
        <p id="empty-hint" class="hint">Waiting for other players to join&hellip;</p>
      </div>

      <aside class="panel self-panel">
        <img id="self-avatar" class="avatar" src="assets/lobby/avatar1.svg" alt="">
        <div id="self-name" class="self-name">player</div>
        <div id="conn-status" class="status status-connecting">
          <span class="dot"></span><span id="conn-text">connecting&hellip;</span>
        </div>
        <button id="logout-btn" class="btn btn-small btn-ghost">Change name</button>
      </aside>
    </section>
  </main>

  <!-- Invite modal -->
  <div id="modal" class="modal" hidden>
    <div class="panel modal-box">
      <img id="modal-avatar" class="avatar avatar-lg" src="assets/lobby/avatar2.svg" alt="">
      <p id="modal-text">Player wants to play Bedwars</p>
      <div class="row">
        <button id="accept-btn" class="btn btn-green">Accept</button>
        <button id="decline-btn" class="btn btn-red">Decline</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast" hidden></div>

  <script src="vendor/mqtt.min.js"></script>
  <script src="net.js"></script>
  <script src="lobby.js"></script>
</body>
</html>
